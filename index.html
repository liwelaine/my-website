<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f6">
  <meta name="description" content="Elaine Lee is a B2B product marketer working across AI products, global demand generation, webinars, and content strategy. Explore four selected case studies.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Elaine Lee — Product Marketing Portfolio">
  <meta property="og:description" content="Selected work in AI product launches, global demand generation, partner webinars, and content strategy.">
  <meta property="og:image" content="https://leeiwen.org/og-image.png">
  <title>Elaine Lee — Product Marketing Portfolio</title>
  <style>
    :root {
      --bg: #f7f8f6;
      --paper: #fff;
      --ink: #20282a;
      --muted: #607072;
      --line: #dce2df;
      --accent: #166677;
      --accent-soft: #e7f0f0;
      --content: 1160px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 3px solid #72b9bf; outline-offset: 4px; }
    .wrap { width: min(calc(100% - 64px), var(--content)); margin-inline: auto; }
    .site-header { border-bottom: 1px solid var(--line); background: var(--bg); }
    .nav { min-height: 84px; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .wordmark { font-size: 19px; line-height: 1.15; font-weight: 750; letter-spacing: -.04em; white-space: nowrap; }
    .wordmark span { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 32px; font-size: 14px; font-weight: 600; }
    .nav-links a:not(.resume-link) { color: #3e4b4d; }
    .nav-links a:hover, .text-link:hover { color: var(--accent); }
    .resume-link { border: 1px solid #aab9b8; border-radius: 4px; padding: 10px 15px; }
    .resume-link:hover { background: var(--paper); border-color: var(--accent); }
    .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 800; line-height: 1.5; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1, h2, h3 { line-height: 1.14; letter-spacing: -.04em; }
    .hero { padding: 70px 0 62px; border-bottom: 1px solid var(--line); }
    .hero-grid { display: block; }
    .hero h1 { max-width: 850px; margin: 16px 0 20px; font-size: clamp(40px, 4.8vw, 60px); font-weight: 730; }
    .hero-intro { max-width: 740px; font-size: 18px; line-height: 1.6; color: #4d5b5d; }
    .cta-row { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; margin-top: 26px; }
    .primary-link { display: inline-flex; align-items: center; gap: 20px; background: var(--ink); color: white; padding: 14px 19px; border-radius: 4px; font-weight: 650; font-size: 14px; }
    .primary-link:hover { background: var(--accent); }
    .text-link { font-size: 14px; font-weight: 650; text-decoration: underline; text-underline-offset: 5px; text-decoration-color: #a5b4b6; }
    .section { padding: 66px 0 84px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 34px; }
    .section-heading h2 { font-size: clamp(32px, 3.7vw, 47px); margin: 10px 0 0; }
    .section-heading p { margin-bottom: 4px; max-width: 390px; color: var(--muted); font-size: 15px; }
    .work-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .work-card { display: flex; flex-direction: column; min-height: 315px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 31px 32px 28px; transition: border-color .2s, transform .2s; }
    .work-card:hover { border-color: #89acb1; transform: translateY(-2px); }
    .card-top, .card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .card-number { font-size: 13px; color: #879496; font-variant-numeric: tabular-nums; font-weight: 700; }
    .card-category { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 800; text-align: right; }
    .work-card h3 { font-size: clamp(26px, 2.7vw, 35px); margin: 33px 0 13px; font-weight: 690; }
    .work-card p { font-size: 15px; color: #5b686a; max-width: 455px; line-height: 1.65; }
    .card-bottom { margin-top: auto; border-top: 1px solid var(--line); padding-top: 21px; }
    .card-result { font-size: 14px; font-weight: 750; color: #244247; max-width: 80%; }
    .card-arrow { color: var(--accent); font-size: 22px; line-height: 1; }
    .about-section { border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 2fr; gap: 80px; padding: 70px 0 90px; }
    .about-section h2 { font-size: 32px; margin: 10px 0 0; }
    .about-copy { font-size: 18px; line-height: 1.67; color: #4e5d5f; }
    .about-copy p { margin-bottom: 20px; }
    .about-links { display: flex; flex-wrap: wrap; gap: 26px; }
    .footer { border-top: 1px solid var(--line); padding: 28px 0 34px; }
    .footer-inner { display: flex; justify-content: space-between; gap: 20px; color: #657375; font-size: 13px; }
    .footer-inner a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

    .case-page { padding-bottom: 95px; }
    .back-link { display: inline-block; margin: 34px 0 52px; font-size: 14px; font-weight: 650; color: var(--accent); }
    .case-hero { max-width: 1000px; }
    .case-hero h1 { font-size: clamp(40px, 4.9vw, 62px); max-width: 980px; margin: 17px 0 23px; }
    .case-lede { font-size: clamp(18px, 2vw, 23px); color: #526164; max-width: 820px; line-height: 1.55; }
    .case-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-block: 1px solid var(--line); margin-top: 53px; }
    .case-fact { padding: 27px 26px 28px 0; }
    .case-fact + .case-fact { border-left: 1px solid var(--line); padding-left: 30px; }
    .case-fact small { display: block; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: 11px; font-weight: 800; margin-bottom: 8px; }
    .case-fact strong { display: block; font-size: clamp(17px, 2vw, 24px); line-height: 1.3; letter-spacing: -.02em; }
    .story { display: grid; grid-template-columns: 240px minmax(0, 720px); gap: 55px; padding-top: 64px; }
    .story-label { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; padding-top: 7px; }
    .story h2 { font-size: clamp(26px, 3vw, 36px); margin: 0 0 19px; }
    .story p, .story li { font-size: 17px; color: #4d5c5e; line-height: 1.75; }
    .story p { margin-bottom: 18px; }
    .story ul { margin: 0 0 0 19px; padding: 0; }
    .story li { padding-left: 4px; margin-bottom: 11px; }
    .story strong { color: var(--ink); }
    .story-divider { border-bottom: 1px solid var(--line); margin-top: 60px; }
    .takeaway { background: var(--accent-soft); padding: 35px 39px; border-radius: 4px; margin-top: 68px; max-width: 1000px; }
    .takeaway .eyebrow { margin-bottom: 9px; }
    .takeaway p { font-size: 20px; line-height: 1.55; margin: 0; max-width: 850px; }
    .source-links { margin-top: 29px; display: flex; flex-wrap: wrap; gap: 25px; }
    .source-links a { font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
    .case-note { font-size: 13px; color: #6b797b; margin-top: 20px; line-height: 1.65; max-width: 880px; }
    .case-end { margin-top: 72px; padding-top: 25px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 22px; align-items: center; }
    .case-end a { font-size: 14px; font-weight: 750; color: var(--accent); }

    @media (max-width: 780px) {
      .wrap { width: min(calc(100% - 36px), var(--content)); }
      .nav { min-height: 72px; }
      .nav-links { gap: 17px; font-size: 13px; }
      .nav-links .nav-about { display: none; }
      .resume-link { padding: 8px 10px; }
      .hero { padding: 60px 0 55px; }
      .section { padding: 66px 0 72px; }
      .section-heading { align-items: start; flex-direction: column; gap: 8px; }
      .work-grid { grid-template-columns: 1fr; }
      .work-card { min-height: 300px; }
      .about-section { grid-template-columns: 1fr; gap: 23px; padding: 55px 0 72px; }
      .story { grid-template-columns: 1fr; gap: 13px; padding-top: 50px; }
      .story-divider { margin-top: 40px; }
      .case-facts { grid-template-columns: 1fr; }
      .case-fact, .case-fact + .case-fact { border-left: 0; border-top: 0; padding: 18px 0; }
      .case-fact + .case-fact { border-top: 1px solid var(--line); }
      .case-hero h1 { font-size: clamp(38px, 8vw, 55px); }
      .takeaway { padding: 28px; }
    }
    @media (max-width: 470px) {
      .wordmark { font-size: 17px; }
      .nav-links { gap: 12px; }
      .nav-links .nav-contact { display: none; }
      .work-card { padding: 26px; }
      .footer-inner { flex-direction: column; gap: 8px; }
      .case-end { flex-direction: column; align-items: start; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .work-card { transition: none; } .work-card:hover { transform: none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="wrap nav" aria-label="Main navigation">
      <a class="wordmark" href="#/">Elaine Lee<span>.</span></a>
      <div class="nav-links">
        <a href="#/work">Work</a>
        <a class="nav-about" href="#/about">About</a>
        <a class="nav-contact" href="mailto:el4427@nyu.edu">Contact</a>
        <a class="resume-link" href="Elaine_Lee_Resume.pdf" target="_blank" rel="noopener">Résumé →</a>
      </div>
    </nav>
  </header>
  <main id="app"></main>
  <footer class="footer">
    <div class="wrap footer-inner">
      <span>© 2026 Elaine Lee · Product Marketing</span>
      <span>NYC area · <a href="mailto:el4427@nyu.edu">Email</a> · <a href="https://github.com/liwelaine" target="_blank" rel="noopener">GitHub</a></span>
    </div>
  </footer>
  <script>
    const projects = [
      {
        id: 'helperai', number: '01', category: 'AI PRODUCT · 0→1 GTM',
        cardTitle: 'HelperAI',
        description: 'Taking a developer AI-agent platform to market—from customer research and positioning to an organic product launch.',
        result: '12,400 waitlist sign-ups in ~3 weeks',
        title: 'Making AI agents easier to build—and easier to bring to market.',
        lede: 'HelperAI was an AI-agent platform for developers, combining integrations, authorization, memory, versioning, and deployment so teams could build and operate action-taking agents without creating all the infrastructure themselves.',
        facts: [['Role', 'Founding Product Marketing Manager'], ['Research', '86 customer interviews'], ['Launch', '12,400 waitlist sign-ups']],
        sections: [
          { label: 'The challenge', title: 'A technical product in a noisy AI market', body: `<p>At an early-stage, YC-backed startup, I was the only marketer on a six-person team. The platform offered capabilities beyond a simple chatbot, but the initial promise of “Let AI Work for You” was too broad to show customers where to begin.</p><p>The marketing challenge was to make the product understandable and identify use cases with a credible reason to adopt.</p>` },
          { label: 'Customer research', title: 'From scattered use cases to a clearer market signal', body: `<p>I gathered input through <strong>86 interviews</strong>, approximately <strong>150 survey responses</strong>, and prototype feedback. Research covered developers, business operators, and teams exploring AI-powered workflows.</p><p>One recurring pain point was moving from an interesting AI demo to a workflow that could access real business tools and take action. Sales prospecting became a more concrete use case to explore than general-purpose automation.</p>` },
          { label: 'Product story', title: 'Translate infrastructure into customer value', body: `<p>HelperAI combined capabilities that developers otherwise had to assemble separately:</p><ul><li><strong>Build faster:</strong> reusable API tools and knowledge sources to connect an agent to real workflows.</li><li><strong>Reduce development overhead:</strong> OAuth2 user authorization and token handling.</li><li><strong>Release with more control:</strong> agent and tool versions, environments, and deployment management.</li></ul><p>For example, a support agent could retrieve customer details and create a ticket—with the required API access and authorization handled through the platform.</p>` },
          { label: 'Launch & outcome', title: 'Organic interest, then product learning', body: `<p>I developed GTM messaging and launch materials, supported product demos, and coordinated community-led distribution, including Product Hunt and developer/AI communities. The launch did not rely on paid advertising.</p><p>The beta generated <strong>12,400 waitlist sign-ups in roughly three weeks</strong> and reached <strong>#23 on Product Hunt</strong>. I also used session recordings and PostHog feedback to understand first-agent setup friction. Sign-ups demonstrated launch interest; deeper activation and product reliability remained important next challenges.</p>` }
        ],
        takeaway: 'The strongest narrative was not “another AI chatbot.” It was the supporting infrastructure that helps developers turn an agent prototype into a useful, deployable workflow.',
        links: [['YC company profile (later Namecard.ai phase)', 'https://www.ycombinator.com/companies/namecard-ai']],
        note: 'HelperAI later evolved through a sales-agent direction into Namecard.ai. This case focuses on the earlier agent platform and its launch; the developer-infrastructure framing summarizes its technical value.'
      },
      {
        id: 'gartner', number: '02', category: 'ASUS × GARTNER · DEMAND GENERATION',
        cardTitle: 'Gartner Demand Engine',
        description: 'Turning third-party research into targeted campaigns, regional distribution, lead qualification, and Sales follow-up.',
        result: '127% of qualified-lead goal · 27 countries',
        title: 'Turning analyst research into qualified enterprise demand.',
        lede: 'A four-wave global B2B campaign at ASUS, connecting Gartner research with the needs of IT and procurement decision-makers through localized content, paid media, syndication, and lead management.',
        facts: [['Scope', '4 campaign waves'], ['Reach', '27 countries'], ['Result', '127% of lead goal']],
        sections: [
          { label: 'The challenge', title: 'Research interest needed to become useful demand', body: `<p>ASUS had a year-long Gartner research program and a goal to generate qualified enterprise contacts. A report download alone did not tell Sales whether a company fit the target profile or had purchasing intent.</p><p>The first campaign wave also launched while regional landing pages, tracking, and Pardot workflows were still being coordinated.</p>` },
          { label: 'Strategy', title: 'Connect trusted research to a buyer problem', body: `<p>I developed ICP and messaging plans around enterprise IT, purchasing, and hybrid-work priorities. Instead of promoting a report as an isolated download, campaign content connected analyst findings to relevant ASUS Business solutions.</p><p>I worked with local teams on landing pages and regional relevance as the program expanded from <strong>9 to 27 markets</strong>.</p>` },
          { label: 'Execution', title: 'Reach, nurture, qualify, hand off', body: `<ul><li><strong>Distribution:</strong> LinkedIn, search, and content syndication were evaluated by response volume, cost, and quality.</li><li><strong>Lifecycle:</strong> educational follow-ups moved from research insights toward product relevance.</li><li><strong>Lead management:</strong> I collaborated with Marketing Operations and regional Sales on Salesforce/Pardot qualification, scoring, routing, and follow-up.</li></ul><p>The campaigns evolved across waves as targeting, creative, markets, and the handoff process improved.</p>` },
          { label: 'Results', title: 'More volume, with qualification attached', body: `<p>The program reached <strong>127% of the qualified-lead target</strong>, while response volume in the largest reported wave was approximately <strong>7.4× the first wave</strong>.</p><p>My key learning was to measure more than downloads: fit, engagement, Sales acceptance, and opportunity progression determine whether content creates value beyond awareness.</p>` }
        ],
        takeaway: 'Analyst credibility attracted the right conversation. Buyer-specific messaging and a defined lead handoff made the campaign commercially useful.',
        links: [['ASUS × Gartner campaign example', 'https://www.asus.com/event/2022-ASUS-analyst-reports/gartner-emerging-technologies-for-digital-workplace-2022/']],
        note: 'Public-facing figures are normalized to protect internal reporting. Qualified/warm contacts should not be interpreted as closed-won customers.'
      },
      {
        id: 'webinar', number: '03', category: 'ASUS × INTEL · PARTNER WEBINAR',
        cardTitle: 'Global Education Webinar',
        description: 'A co-marketing event with Intel and Google for Education speakers—built for global awareness, registrations, and follow-up.',
        result: '~2,000 registrations · 21% live attendance',
        title: 'Building a global webinar around a relevant education story.',
        lede: 'I helped bring together ASUS, Intel, and education-industry voices for a thought-leadership webinar, creating an end-to-end program from positioning and promotion to live delivery and post-event lead follow-up.',
        facts: [['Audience', 'Global education buyers'], ['Registrations', '~2,000'], ['Live attendance', '~422 · 21%']],
        sections: [
          { label: 'The challenge', title: 'Make a partner event relevant—and measurable', body: `<p>ASUS Education needed a credible way to engage schools and institutional buyers beyond product-focused promotions. It was also an early global webinar effort, so audience demand, partner coordination, and the end-to-end follow-up plan had to be built together.</p>` },
          { label: 'Event strategy', title: 'Lead with education priorities, not hardware specs', body: `<p>I shaped the campaign around education challenges and technology trends, aligning the event narrative with ASUS, Intel, and Google for Education perspectives. Partner participation created a stronger reason to register than a single-brand product pitch.</p><p>Two live sessions were planned to serve <strong>EMEA and APAC time zones</strong>, with a Gartner education report used as a registration incentive.</p>` },
          { label: 'Execution', title: 'One campaign, multiple lifecycle moments', body: `<ul><li><strong>Before:</strong> registration page, partner promotion, email invitations, and reminder cadence.</li><li><strong>During:</strong> speaker coordination, live programming, and the attendee experience.</li><li><strong>After:</strong> distinct follow-up for attendees and no-shows, on-demand materials, and country-level Sales routing.</li></ul><p>I collaborated across partner, regional marketing, and Sales teams to connect the event with the broader demand-generation program.</p>` },
          { label: 'Results', title: 'A repeatable partner-led demand motion', body: `<p>The webinar attracted approximately <strong>2,000 registrants</strong> and <strong>422 live attendees</strong> (about <strong>21%</strong> attendance). The follow-up assets continued to support engagement after the live sessions.</p><p>The project reinforced that an event is a lifecycle journey—from invitation and registration to attendance, content engagement, and follow-up—not a standalone broadcast.</p>` }
        ],
        takeaway: 'A strong partner webinar starts with a buyer-relevant topic and ends with a specific next step for each audience segment.',
        links: [],
        note: 'Registration and attendance are event metrics; they are not presented as directly attributed revenue.'
      },
      {
        id: 'content', number: '04', category: 'ASUS BUSINESS · CONTENT STRATEGY',
        cardTitle: 'Content Strategy',
        description: 'Making complex B2B product value useful across industries, regions, campaign channels, and Sales conversations.',
        result: '40+ content pieces · 30+ sales assets',
        title: 'A content system built around buyer needs and Sales use.',
        lede: 'At ASUS Business, I developed and coordinated content across campaigns, industry audiences, and regional teams—translating technical device capabilities into narratives customers and Sales could actually use.',
        facts: [['Focus', 'B2B messaging & content'], ['Content', '40+ pieces'], ['Enablement', '30+ sales assets']],
        sections: [
          { label: 'The challenge', title: 'One product portfolio, many buying contexts', body: `<p>Enterprise device buyers did not all care about the same message. An IT manager might prioritize manageability and security, while a procurement lead focused on lifecycle value. Regional teams also needed material they could adapt without rebuilding the story each time.</p>` },
          { label: 'Strategy', title: 'Organize content by buyer, need, and journey', body: `<p>I used audience priorities and product value propositions to shape topic angles, then connected them to campaign goals and funnel stages.</p><p>For example, a hybrid-work research theme could become an educational article for discovery, a solution-focused landing page for evaluation, and a concise product proof point for a Sales conversation.</p>` },
          { label: 'Execution', title: 'Turn one insight into multiple useful assets', body: `<ul><li><strong>Thought leadership:</strong> articles, research-based content, and industry-specific narratives.</li><li><strong>Campaign content:</strong> landing pages, email, paid/social copy, and webinar promotion.</li><li><strong>Sales enablement:</strong> presentations, solution messaging, and reusable materials for regional teams.</li></ul><p>Across the program, I contributed to <strong>40+ marketing content pieces</strong> and <strong>30+ Sales materials</strong>, partnering with product, creative, and regional teams.</p>` },
          { label: 'What it shows', title: 'Consistency without one-size-fits-all messaging', body: `<p>The goal was not simply to produce more assets. It was to give different audiences a clear reason to care while keeping the underlying ASUS Business value proposition consistent across channels.</p><p>I have since explored the same operating idea through an independent AI Content Pipeline project, linking personas, content variants, CRM-style distribution, and performance analysis.</p>` }
        ],
        takeaway: 'Good content strategy makes a complex portfolio easier to understand—and easier for regional marketing and Sales teams to activate.',
        links: [['Related AI Content Pipeline project', 'https://github.com/liwelaine/ai-pmm-workflows'], ['AI workflow case study', 'portfolio-case-study-2.html']],
        note: 'The AI Content Pipeline is an independent later project, not part of the historical ASUS program.'
      }
    ];

    const app = document.getElementById('app');
    const projectById = Object.fromEntries(projects.map(p => [p.id, p]));

    function homePage() {
      return `
        <section class="hero">
      <div class="wrap hero-grid">
            <div>
              <div class="eyebrow">Elaine Lee · Product Marketing</div>
              <h1>Product marketing for complex products.</h1>
              <p class="hero-intro">B2B product marketer with experience across AI startups and global enterprise technology. I work on customer research, positioning, launches, demand generation, and content that supports real business outcomes.</p>
              <div class="cta-row"><a class="primary-link" href="#/work">Explore selected work <span aria-hidden="true">→</span></a><a class="text-link" href="mailto:el4427@nyu.edu">Get in touch</a></div>
            </div>
          </div>
        </section>
        <section class="section" id="work">
          <div class="wrap">
            <div class="section-heading"><div><div class="eyebrow">Selected work · 4 projects</div><h2>Case studies</h2></div><p>Four projects showing how I connect customer insight, a clear story, and execution.</p></div>
            <div class="work-grid">
              ${projects.map(p => `<a class="work-card" href="#/${p.id}" aria-label="Read ${p.cardTitle} case study"><div class="card-top"><span class="card-number">${p.number} / 04</span><span class="card-category">${p.category}</span></div><h3>${p.cardTitle}</h3><p>${p.description}</p><div class="card-bottom"><span class="card-result">${p.result}</span><span class="card-arrow" aria-hidden="true">→</span></div></a>`).join('')}
            </div>
          </div>
        </section>
        <section class="wrap about-section" id="about">
          <div><div class="eyebrow">About</div><h2>Hi, I'm Elaine.</h2></div>
          <div class="about-copy"><p>My work spans early-stage AI product launches and global B2B marketing at ASUS. I like making technical value clear, understanding what different buyers need, and building programs that connect a message to measurable action.</p><p>I also hold an M.S. in Information Systems from NYU, bringing hands-on technical fluency to product and go-to-market conversations.</p><div class="about-links"><a class="text-link" href="Elaine_Lee_Resume.pdf" target="_blank" rel="noopener">View résumé →</a><a class="text-link" href="mailto:el4427@nyu.edu">Email me →</a><a class="text-link" href="https://github.com/liwelaine" target="_blank" rel="noopener">GitHub →</a></div></div>
        </section>`;
    }

    function casePage(p) {
      const idx = projects.findIndex(x => x.id === p.id);
      const next = projects[(idx + 1) % projects.length];
      return `<article class="wrap case-page">
        <a class="back-link" href="#/work">← All projects</a>
        <header class="case-hero"><div class="eyebrow">${p.number} / 04 · ${p.category}</div><h1>${p.title}</h1><p class="case-lede">${p.lede}</p></header>
        <div class="case-facts">${p.facts.map(f => `<div class="case-fact"><small>${f[0]}</small><strong>${f[1]}</strong></div>`).join('')}</div>
        ${p.sections.map((s, i) => `<section class="story" aria-labelledby="story-${i}"><div class="story-label">${String(i + 1).padStart(2, '0')} / ${s.label}</div><div><h2 id="story-${i}">${s.title}</h2>${s.body}</div></section>${i < p.sections.length - 1 ? '<div class="story-divider"></div>' : ''}`).join('')}
        <div class="takeaway"><div class="eyebrow">Key takeaway</div><p>${p.takeaway}</p></div>
        ${p.links.length ? `<div class="source-links">${p.links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} →</a>`).join('')}</div>` : ''}
        ${p.note ? `<p class="case-note">${p.note}</p>` : ''}
        <div class="case-end"><a href="#/work">← All projects</a><a href="#/${next.id}">Next: ${next.cardTitle} →</a></div>
      </article>`;
    }

    function render() {
      let route = (location.hash || '#/').replace(/^#\/?/, '');
      const aliases = { 'work': '', 'work/chainsight': 'helperai', 'work/helperai': 'helperai', 'work/demand-gen': 'gartner', 'work/gartner': 'gartner', 'work/webinar': 'webinar', 'work/asus': 'content', 'work/content-strategy': 'content', 'ai-workflow': 'content' };
      if (Object.prototype.hasOwnProperty.call(aliases, route)) route = aliases[route];
      const project = projectById[route];
      app.innerHTML = project ? casePage(project) : homePage();
      document.title = project ? `${project.cardTitle} — Elaine Lee` : 'Elaine Lee — Product Marketing Portfolio';
      const scrollTarget = route === 'about' || route === 'contact' ? 'about' : (location.hash === '#/work' ? 'work' : null);
      requestAnimationFrame(() => scrollTarget ? document.getElementById(scrollTarget)?.scrollIntoView() : window.scrollTo(0, 0));
    }
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
